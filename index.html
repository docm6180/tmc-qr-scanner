<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#123c64"><title>TMC QR Scanner</title><link rel="manifest" href="manifest.webmanifest"><link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png"><link rel="apple-touch-icon" href="icons/icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="TMC QR Scanner"><style>body{font-family:system-ui,sans-serif;background:#f3f6fa;color:#172b42;margin:0}header{background:#123c64;color:white;padding:18px}main{max-width:780px;margin:auto;padding:15px}.card{background:white;border-radius:14px;padding:16px;margin:12px 0;box-shadow:0 2px 10px #0001}button,input,textarea,select{font:inherit;padding:11px;border-radius:9px;border:1px solid #bcc8d4;box-sizing:border-box}button{background:#1262a3;color:white;border:0;margin:4px;cursor:pointer}input,textarea{width:100%;margin:5px 0 12px}label{font-weight:600}video{display:block;width:100%;height:260px;object-fit:cover;border-radius:10px;background:#111}#raw{height:76px;min-height:76px;resize:vertical;overflow-wrap:anywhere;font-size:14px}#status{margin:9px 0}header{padding:12px 16px}header h2{font-size:20px;margin:3px 0 7px}.card{padding:13px;margin:9px 0}main{padding:9px}#lang{width:auto;max-width:100%;background:white;color:#123c64;margin:4px 0}#fields{display:grid;grid-template-columns:1fr 1fr;gap:5px 10px}#fields label{display:block;font-size:12px}#fields input{margin:3px 0 7px;padding:9px;min-width:0}.field{min-width:0}table{width:100%;border-collapse:collapse;font-size:13px}td,th{border-bottom:1px solid #ddd;padding:8px;text-align:left}small{color:#657486}.scroll{overflow:auto}.warn{color:#aa4a00}#status{white-space:pre-wrap}</style></head><body><header><h2>TMC QR 物料扫描 V2.0</h2><select id="lang" aria-label="Language"><option value="zh">中文</option><option value="en">English</option><option value="ms">Bahasa Melayu</option></select><div id="subtitle">手机扫描 · 六项 QR 资料 · 每张标签独立记录 · CSV 导出</div></header><main><section class="card"><h3>1. 扫描 QR Code</h3><button id="start">开启相机扫描</button><button id="stop">关闭相机</button><video id="video" playsinline muted autoplay></video><canvas id="capture" hidden></canvas><p id="status">请开启相机扫描 QR Code。</p><textarea id="raw" style="display:none" aria-hidden="true"></textarea><button id="parse" style="display:none" aria-hidden="true">解析 QR 内容</button></section><section class="card"><h3>2. 确认物料资料</h3><div id="fields"></div><button id="save">确认并保存</button><button id="clear">清空输入</button><p><small id="note">只记录 QR 中的六个字段，不累计或合并重量。</small></p></section><section class="card"><h3>3. 扫描记录</h3><button id="export">导出 CSV（Excel 可打开）</button><button id="backup">备份 JSON</button><label id="restoreLabel">恢复 JSON 备份</label><input id="restore" type="file" accept="application/json"><div class="scroll" id="records"></div></section></main><script>
const keys=[['label','Label No.'],['warehouse','Warehouse'],['location','Location'],['lot','Lot No.'],['part','Part No.'],['net','Net Weight (KG)']];let rows=[];try{rows=JSON.parse(localStorage.getItem('tmc_qr_records')||'[]')}catch{};let stream=null,scanning=false,lastSeen="",lastSeenAt=0;let audioCtx=null;const $=id=>document.getElementById(id);const escape=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));$('fields').innerHTML=keys.map(([k,n])=>`<div class="field"><label id="l_${k}" for="f_${k}">${n}</label><input id="f_${k}" autocomplete="off"></div>`).join('');function get(){return Object.fromEntries(keys.map(([k])=>[k,$('f_'+k).value.trim()]))}function fill(d){keys.forEach(([k])=>{$('f_'+k).value=d[k]??''})}function parse(s){let d={};let compact=s.trim().replace(/\s*\n\s*/g,'');let parts=compact.split('|').map(x=>x.trim());if(parts.length>=6 && /^NO\.?\s*\d+$/i.test(parts[0]) && /^\d+(?:\.\d+)?$/.test(parts[5])){d.label=parts[0].replace(/^NO\.?\s*/i,'');d.warehouse=parts[1];d.location=parts[2];d.lot=parts[3];d.part=parts[4];d.net=parts[5];return d;}let obj;try{obj=JSON.parse(s)}catch{};if(obj&&typeof obj==='object'&&!Array.isArray(obj)){for(const [k,v] of Object.entries(obj)){let key=keys.find(([id,n])=>[id,n].some(x=>x.toLowerCase()===k.toLowerCase().trim()));if(key)d[key[0]]=String(v)}}let aliases={label:['LABEL','LABEL NO','LABEL NO.','標籤號碼'],lot:['LOT','LOT NO','LOT NO.','批號'],source:['SOURCE','來源'],description:['DESCRIPTION','品名'],spec:['SPEC','規格'],part:['PART NO','PART NO.','料號'],net:['NET','NET WEIGHT','淨重'],gross:['GROSS','毛重'],container:['CONTAINER','容器重'],date:['DATE','日期'],weigher:['WEIGHER'],check:['CHECK'],tax:['TAX TYPE'],code:['CODE']};for(let line of s.split(/[\r\n;]+/)){let m=line.match(/^\s*([^:=：]+?)\s*[:=：]\s*(.+)\s*$/);if(!m)continue;let key=Object.keys(aliases).find(k=>aliases[k].includes(m[1].trim().toUpperCase()));if(key)d[key]=m[2].trim()}return d}function ingest(s){$('raw').value=s;let d=parse(s);fill(d);$('status').textContent=Object.keys(d).length?t('parsed').replace('{n}',Object.keys(d).length):t('unmatched')}$('parse').onclick=()=>ingest($('raw').value);let scanBusy=false, detector=null, fallbackLoaded=false;
function setStatus(msg){$('status').textContent=msg}
async function loadFallback(){
 if(window.jsQR){fallbackLoaded=true;return true}
 return new Promise(resolve=>{const el=document.createElement('script');el.src='https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js';el.onload=()=>{fallbackLoaded=!!window.jsQR;resolve(fallbackLoaded)};el.onerror=()=>resolve(false);document.head.appendChild(el)})
}
async function scanLoop(){
 if(!scanning)return;
 if(!scanBusy && $('video').readyState>=2){scanBusy=true;
 try{let value='';if(detector){const found=await detector.detect($('video'));value=found[0]?.rawValue||''}
 else if(window.jsQR){let video=$('video'),canvas=$('capture');canvas.width=video.videoWidth;canvas.height=video.videoHeight;const ctx=canvas.getContext('2d',{willReadFrequently:true});ctx.drawImage(video,0,0);const pixels=ctx.getImageData(0,0,canvas.width,canvas.height);value=window.jsQR(pixels.data,canvas.width,canvas.height,{inversionAttempts:'dontInvert'})?.data||''}
 if(value){const now=Date.now();if(value!==lastSeen || now-lastSeenAt>6000){lastSeen=value;lastSeenAt=now;ingest(value);if(Object.keys(parse(value)).length===6)beepSuccess();setStatus(t('recognized'))}}
 }catch(err){setStatus(t('scanError')+': '+err.message)}finally{scanBusy=false}}
 if(scanning)setTimeout(scanLoop,200);
}
function beepSuccess(){
 try{
  if(!audioCtx)return;
  if(audioCtx.state==='suspended')audioCtx.resume().catch(()=>{});
  const now=audioCtx.currentTime,osc=audioCtx.createOscillator(),gain=audioCtx.createGain();
  osc.type='sine';osc.frequency.setValueAtTime(1100,now);
  gain.gain.setValueAtTime(0.0001,now);gain.gain.exponentialRampToValueAtTime(0.22,now+0.015);
  gain.gain.exponentialRampToValueAtTime(0.0001,now+0.14);
  osc.connect(gain);gain.connect(audioCtx.destination);osc.start(now);osc.stop(now+0.15);
 }catch(e){console.warn('Beep unavailable',e)}
}
$('start').onclick=async()=>{
 try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();await audioCtx.resume()}catch(e){console.warn('Audio unavailable',e)}
 if(stream){setStatus(t('scanning'));return}
 if(!navigator.mediaDevices?.getUserMedia){setStatus(t('unsupported'));return}
 try{stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:'environment'}}});$('video').srcObject=stream;await $('video').play();
 try{if('BarcodeDetector' in window)detector=new BarcodeDetector({formats:['qr_code']});else detector=null}catch{detector=null}
 scanning=true;setStatus(t('scanning'));
 if(!detector && !await loadFallback()){setStatus(t('noDecoder'));}else scanLoop();
 }catch(err){stop();setStatus(t('cameraError')+': '+err.message)}
};
function stop(){scanning=false;lastSeen='';detector=null;if(stream)stream.getTracks().forEach(track=>track.stop());stream=null;$('video').srcObject=null}
$('stop').onclick=()=>{stop();setStatus(t('stopped'))};
document.addEventListener('visibilitychange',()=>{if(document.hidden&&stream){stop();setStatus(t('stopped'))}});
$('clear').onclick=()=>{fill(Object.fromEntries(keys.map(([k])=>[k,''])));$('raw').value=''};$('save').onclick=()=>{let d=get();if(!d.label&&!d.lot){alert(t('required'));return}if(d.net&&!Number.isFinite(Number(d.net.replace(/KG/gi,'').trim()))){alert(t('numeric'));return}if(d.label&&rows.some(r=>r.label===d.label)){if(!confirm(t('duplicate')))return}rows.push({...d,raw:$('raw').value,scannedAt:new Date().toISOString()});persist();$('status').textContent=t('saved')};function persist(){localStorage.setItem('tmc_qr_records',JSON.stringify(rows));render()}function render(){ $('records').innerHTML='<p>'+t('count').replace('{n}',rows.length)+'</p><table><tr><th>'+t('time')+'</th><th>Label No.</th><th>Warehouse</th><th>Location</th><th>Lot No.</th><th>Part No.</th><th>Net KG</th><th>'+t('action')+'</th></tr>'+rows.map((r,i)=>`<tr><td>${escape(r.scannedAt?.slice(0,16).replace('T',' '))}</td><td>${escape(r.label)}</td><td>${escape(r.warehouse)}</td><td>${escape(r.location)}</td><td>${escape(r.lot)}</td><td>${escape(r.part)}</td><td>${escape(r.net)}</td><td><button data-delete="${i}">${t('delete')}</button></td></tr>`).join('')+'</table>';document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>{if(confirm(t('deleteConfirm'))){rows.splice(+b.dataset.delete,1);persist()}})}function download(name,content,type){let a=document.createElement('a'),url=URL.createObjectURL(new Blob([content],{type}));a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),3000)}$('export').onclick=()=>{let headers=['scannedAt',...keys.map(x=>x[0])];let csv='\ufeff'+headers.join(',')+'\r\n'+rows.map(r=>headers.map(k=>'"'+String(r[k]||'').replace(/"/g,'""')+'"').join(',')).join('\r\n');download('TMC_QR_Records_V2_0.csv',csv,'text/csv;charset=utf-8');setTimeout(()=>{if(confirm(t('exportClearConfirm'))){rows=[];persist();$('status').textContent=t('historyCleared')}},500)};$('backup').onclick=()=>download('TMC_QR_Backup.json',JSON.stringify(rows,null,2),'application/json');$('restore').onchange=async e=>{try{let a=JSON.parse(await e.target.files[0].text());if(!Array.isArray(a))throw Error('格式不正确');if(confirm(t('restoreConfirm'))){rows=a;persist()}}catch(err){alert('恢复失败：'+err.message)}};
const translations={
zh:{subtitle:'手机扫描 · 六项 QR 资料 · 每张标签独立记录 · CSV 导出',scanTitle:'1. 扫描 QR Code',start:'开启相机扫描',stop:'关闭相机',rawLabel:'QR 原始内容',rawPlaceholder:'扫描后自动显示完整 QR 内容',parse:'解析 QR 内容',fieldsTitle:'2. 确认物料资料',save:'确认并保存',clear:'清空输入',note:'每张标签独立记录，重量不累计。',recordsTitle:'3. 扫描记录',export:'导出 CSV',backup:'备份 JSON',restoreLabel:'恢复 JSON 备份',labels:['Label No.','Warehouse','Location','Lot No.','Part No.','Net Weight (KG)'],recognized:'已识别 6 个字段；相机保持开启。',scanning:'正在扫描，请对准 QR Code…',parsed:'已识别 {n} 个字段，请检查并保存。',unmatched:'已读取 QR，但格式未匹配，请检查原始内容。',saved:'记录已保存，可继续扫描下一张。',duplicate:'这个 Label No. 已保存过，仍要重复保存吗？',required:'请填写 Label No. 或 Lot No.',numeric:'重量必须是数字',deleteConfirm:'确定删除这条记录？',restoreConfirm:'恢复备份会覆盖现有记录，继续吗？',count:'已保存 {n} 笔记录（重量不累计）',time:'扫描时间',action:'操作',delete:'删除',unsupported:'此浏览器无法使用相机，请通过 HTTPS 打开。',noDecoder:'相机已开启，但 QR 解码器未能加载。请连接网络后重试。',cameraError:'无法开启相机',scanError:'扫描错误',stopped:'相机已关闭',exportClearConfirm:'CSV 已开始下载。请先确认文件已成功保存到手机或电脑。\n\n确认已保存并清空全部扫描历史？\n（取消可保留记录）',historyCleared:'扫描历史已清空，可以继续扫描。'},
en:{subtitle:'Mobile QR scanning · Six fields · Individual records · CSV export',scanTitle:'1. Scan QR Code',start:'Start camera',stop:'Stop camera',rawLabel:'Full QR content',rawPlaceholder:'Full QR text appears here after scanning',parse:'Parse QR',fieldsTitle:'2. Verify material details',save:'Save record',clear:'Clear fields',note:'Each label is saved separately; weights are not totaled.',recordsTitle:'3. Scan history',export:'Export CSV',backup:'Backup JSON',restoreLabel:'Restore JSON backup',labels:['Label No.','Warehouse','Location','Lot No.','Part No.','Net Weight (KG)'],recognized:'Six fields detected. Camera remains on.',scanning:'Scanning… Aim at a QR code.',parsed:'Detected {n} fields. Review and save.',unmatched:'QR read, but format not recognized. Check the full QR text.',saved:'Record saved. You can scan the next label.',duplicate:'This Label No. is already saved. Save a duplicate?',required:'Enter a Label No. or Lot No.',numeric:'Net weight must be a number.',deleteConfirm:'Delete this record?',restoreConfirm:'Restoring will replace current records. Continue?',count:'{n} saved records (no weight totals)',time:'Scanned at',action:'Action',delete:'Delete',unsupported:'Camera unavailable. Open the site over HTTPS.',noDecoder:'Camera opened but QR decoder could not load. Connect to the internet and retry.',cameraError:'Cannot open camera',scanError:'Scan error',stopped:'Camera stopped',exportClearConfirm:'CSV download started. Check that the file was saved successfully.\n\nClear ALL scan history now?\n(Cancel keeps your records.)',historyCleared:'Scan history cleared. Ready for new scans.'},

let language=localStorage.getItem('tmc_qr_lang')||'zh';function t(k){return (translations[language]||translations.zh)[k]||k}
function translate(){document.documentElement.lang=language;$('lang').value=language;let ids={subtitle:'subtitle',note:'note',restoreLabel:'restoreLabel',start:'start',stop:'stop',parse:'parse',save:'save',clear:'clear',export:'export',backup:'backup'};for(let [id,key] of Object.entries(ids))$(id).textContent=t(key);document.querySelectorAll('h3')[0].textContent=t('scanTitle');document.querySelectorAll('h3')[1].textContent=t('fieldsTitle');document.querySelectorAll('h3')[2].textContent=t('recordsTitle');keys.forEach(([k],i)=>$('l_'+k).textContent=t('labels')[i]);render()}
$('lang').addEventListener('change',e=>{language=e.target.value;localStorage.setItem('tmc_qr_lang',language);translate();$('status').textContent=stream?t('scanning'):t('stopped')});
translate();
</script></body></html>
